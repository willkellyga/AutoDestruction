# Auto Destruction's online server on Fly.io (see FLY.md). From the repo's root: fly deploy --ha=false
# The rooms live in the server's memory, so there is exactly one machine, always on.
app = 'auto-destruction'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Device reports (derby/server/reports.mjs) go to /data/reports.jsonl on a 1 GB volume, so they outlive deploys.
# Make the volume once before the first deploy with these lines (FLY.md): fly volumes create ad_reports --size 1 --region iad
[env]
  DATA_DIR = '/data'

[mounts]
  source = 'ad_reports'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
