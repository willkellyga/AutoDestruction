# Auto Destruction's online server on Fly.io (see derby/FLY.md). Deploy from the repo's root:
#   fly deploy --config derby/fly.toml --dockerfile derby/Dockerfile --ha=false
# The rooms live in the server's memory, so there is exactly one machine, always on.
app = 'auto-destruction'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
