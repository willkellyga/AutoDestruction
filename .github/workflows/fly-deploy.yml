# Deploys the game to auto-destruction.fly.dev on every push to main (each merged PR), the same as running
# `fly deploy --ha=false` from a fresh clone (FLY.md). Needs the repo secret FLY_API_TOKEN (`fly tokens create deploy -a auto-destruction`).
# Run it by hand from the Actions tab with "Run workflow".
name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running one instead of cancelling it halfway.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the live site answers
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://auto-destruction.fly.dev/healthz
